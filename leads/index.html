<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Private lead list.">
<meta name="theme-color" content="#faf9f6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/index-D6-FHxj0.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%231b3a2c'/%3E%3Cpath d='M11 27 20 13 29 27' fill='none' stroke='%23eef7f0' stroke-width='2.4' stroke-linejoin='round' stroke-linecap='round'/%3E%3Cpath d='M20 14v13' stroke='%23e08a52' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  body { background: var(--bg-alt); }
  [hidden] { display: none !important; }

  /* ---------- Sign in ---------- */
  .gate { width: min(100% - 2rem, 420px); margin: 0 auto; padding: clamp(3rem, 12vh, 7rem) 0 4rem; }
  .gate .kicker { justify-content: flex-start; }
  .gate h1 { font-size: clamp(2.2rem, 1.8rem + 2vw, 3rem); margin-top: 0.5rem; }
  .gate form { display: grid; gap: 1rem; margin-top: 1.8rem; }
  .gate .btn { width: 100%; }

  /* ---------- Shell ---------- */
  .bar {
    position: sticky; top: 0; z-index: 50;
    background: oklch(0.975 0.004 90 / 0.92); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .bar-inner {
    width: min(100% - 2rem, 1080px); margin-inline: auto;
    display: flex; align-items: center; gap: 1rem; padding: 0.9rem 0;
  }
  .bar h1 { font-size: 1.6rem; line-height: 1; }
  .bar-actions { margin-left: auto; display: flex; gap: 0.5rem; }
  .bar-actions .btn { padding: 0.6rem 1rem; font-size: 0.76rem; }

  .page { width: min(100% - 2rem, 1080px); margin: 0 auto; padding: 1.5rem 0 5rem; }

  /* ---------- Stats ---------- */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.8rem; margin-bottom: 1.5rem; }
  .stat {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r-md);
    padding: 1rem 1.1rem;
  }
  .stat b { display: block; font-family: var(--font-display); font-size: 2.1rem; line-height: 1; font-weight: 400; }
  .stat span { display: block; margin-top: 0.35rem; font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .stat.is-hot b { color: oklch(0.5 0.17 25); }

  /* ---------- Controls ---------- */
  .controls { display: grid; grid-template-columns: 1fr 260px; gap: 0.8rem; margin-bottom: 1rem; }
  .chips { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.5rem; }
  .chip {
    padding: 0.55rem 1rem; border: 1px solid var(--line-strong); border-radius: 100px;
    background: var(--bg); font-size: 0.84rem; font-weight: 550; cursor: pointer;
    transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
  }
  .chip:hover { border-color: var(--ink); }
  .chip[aria-pressed="true"] { background: var(--charcoal); border-color: var(--charcoal); color: var(--ivory); }

  /* ---------- Lead cards ---------- */
  .list { display: grid; gap: 0.9rem; }
  .lead {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r-md);
    padding: 1.2rem 1.3rem; box-shadow: var(--shadow-sm);
  }
  .lead.is-hot { border-color: oklch(0.82 0.09 25); box-shadow: 0 0 0 1px oklch(0.82 0.09 25 / 0.4), var(--shadow-sm); }

  .lead-top { display: flex; align-items: baseline; gap: 0.7rem; flex-wrap: wrap; }
  .lead-name { font-size: 1.18rem; font-weight: 650; letter-spacing: -0.01em; }
  .lead-when { margin-left: auto; font-size: 0.78rem; color: var(--faint); white-space: nowrap; }
  .badge {
    font-size: 0.68rem; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase;
    padding: 0.28rem 0.55rem; border-radius: var(--r-sm); border: 1px solid;
  }
  .badge-hot { color: oklch(0.45 0.17 25); background: oklch(0.965 0.028 25); border-color: oklch(0.85 0.09 25); }
  .badge-new { color: var(--gold-deep); background: var(--gold-soft); border-color: var(--gold-line); }

  .lead-prop { margin-top: 0.3rem; font-size: 0.92rem; color: var(--muted); }
  .lead-meta { display: flex; flex-wrap: wrap; gap: 0.45rem; margin-top: 0.9rem; }
  .tag {
    font-size: 0.78rem; color: var(--ink); background: var(--bg-alt);
    border: 1px solid var(--line); border-radius: var(--r-sm); padding: 0.32rem 0.6rem;
  }
  .tag.warn { color: oklch(0.45 0.17 25); background: oklch(0.965 0.028 25); border-color: oklch(0.85 0.09 25); }

  .lead-notes {
    margin-top: 0.9rem; font-size: 0.9rem; line-height: 1.6; color: var(--ink);
    border-left: 2px solid var(--gold-line); padding-left: 0.9rem;
  }

  .lead-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1.1rem; }
  .lead-actions a {
    display: inline-flex; align-items: center; gap: 0.4rem;
    padding: 0.6rem 1rem; border: 1px solid var(--line-strong); border-radius: var(--r-sm);
    font-size: 0.84rem; font-weight: 600; transition: background-color 0.2s ease, border-color 0.2s ease;
  }
  .lead-actions a:hover { background: var(--bg-alt); border-color: var(--ink); }
  .lead-actions a.primary { background: var(--charcoal); border-color: var(--charcoal); color: var(--ivory); }
  .lead-actions a.primary:hover { background: var(--charcoal-deep); }
  .lead-actions svg { width: 15px; height: 15px; }

  .lead-track {
    display: flex; flex-wrap: wrap; align-items: center; gap: 0.7rem;
    margin-top: 1.1rem; padding-top: 1.1rem; border-top: 1px solid var(--line);
  }
  .lead-track .select { width: auto; min-width: 170px; padding: 0.55rem 0.8rem; font-size: 0.88rem; }
  .lead-track .textarea { min-height: 44px; font-size: 0.9rem; padding: 0.6rem 0.8rem; flex: 1 1 260px; }

  /* Page level, not per card: changing a status rebuilds the card it came from. */
  .saved {
    position: fixed; left: 50%; bottom: 1.6rem; transform: translate(-50%, 12px);
    z-index: 80; padding: 0.7rem 1.3rem; border-radius: 100px;
    background: var(--charcoal); color: var(--ivory);
    font-size: 0.82rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
    box-shadow: var(--shadow-md); opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s var(--ease-out);
  }
  .saved.on { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- Add someone by hand ---------- */
  .add {
    background: var(--card); border: 1px solid var(--gold-line); border-radius: var(--r-md);
    padding: 1.3rem; margin-bottom: 1.5rem; box-shadow: var(--shadow-sm);
  }
  .add h2 { font-size: 1.5rem; margin-bottom: 1.1rem; }
  .add-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.9rem; }
  .add-grid .span2 { grid-column: span 2; }
  .add-grid .span3 { grid-column: 1 / -1; }
  .add-grid .input, .add-grid .select, .add-grid .textarea { margin-top: 0.35rem; }
  .add-grid .textarea { min-height: 70px; }
  .add-actions { display: flex; gap: 0.7rem; margin-top: 1.2rem; align-items: center; }
  .add-err { font-size: 0.86rem; color: oklch(0.45 0.17 25); }
  @media (max-width: 720px) {
    .add-grid { grid-template-columns: 1fr; }
    .add-grid .span2, .add-grid .span3 { grid-column: auto; }
  }

  .empty { text-align: center; padding: 4rem 1rem; color: var(--muted); }
  .err {
    font-size: 0.9rem; line-height: 1.55; color: oklch(0.42 0.16 25);
    background: oklch(0.97 0.02 25); border: 1px solid oklch(0.82 0.09 25);
    border-radius: var(--r-sm); padding: 0.85rem 1rem; margin-bottom: 1.2rem;
  }

  @media (max-width: 720px) {
    .controls { grid-template-columns: 1fr; }
    .stats { grid-template-columns: 1fr; }
    .stat { display: flex; align-items: baseline; gap: 0.8rem; }
    .stat b { font-size: 1.7rem; }
    .stat span { margin-top: 0; }
    .bar h1 { font-size: 1.35rem; }
    .lead-actions a { flex: 1 1 auto; justify-content: center; }
  }
</style>
</head>
<body>

<!-- ---------- Sign in ---------- -->
<main class="gate" id="gate" hidden>
  <p class="kicker">Private</p>
  <h1>Leads</h1>
  <form id="login">
    <div>
      <label class="flabel" for="email">Email</label>
      <input class="input" id="email" type="email" autocomplete="username" required>
    </div>
    <div>
      <label class="flabel" for="password">Password</label>
      <input class="input" id="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn btn-dark" type="submit" id="login-btn">Sign In</button>
    <p class="admin-err" id="login-err" hidden></p>
  </form>
</main>

<!-- ---------- App ---------- -->
<div id="app" hidden>
  <header class="bar">
    <div class="bar-inner">
      <h1>Leads</h1>
      <div class="bar-actions">
        <button class="btn btn-gold" type="button" id="add-toggle">Add Someone</button>
        <a class="btn btn-line" href="/qr">QR Sign</a>
        <button class="btn btn-line" type="button" id="export">Export CSV</button>
        <button class="btn btn-line" type="button" id="signout">Sign Out</button>
      </div>
    </div>
  </header>

  <main class="page">
    <div class="err" id="app-err" hidden></div>

    <form class="add" id="add" hidden>
      <h2>Add someone</h2>
      <div class="add-grid">
        <div class="span2">
          <label class="flabel" for="a-name">Name <span class="req">*</span></label>
          <input class="input" id="a-name" autocomplete="off">
        </div>
        <div>
          <label class="flabel" for="a-phone">Phone</label>
          <input class="input" id="a-phone" type="tel" inputmode="tel" autocomplete="off">
        </div>
        <div class="span2">
          <label class="flabel" for="a-email">Email</label>
          <input class="input" id="a-email" type="email" autocomplete="off">
        </div>
        <div>
          <label class="flabel" for="a-property">Property</label>
          <input class="input" id="a-property" autocomplete="off" placeholder="Where you met">
        </div>
        <div>
          <label class="flabel" for="a-timeline">Timeline</label>
          <select class="select" id="a-timeline"></select>
        </div>
        <div>
          <label class="flabel" for="a-agent">Has an agent</label>
          <select class="select" id="a-agent">
            <option value="false">No</option>
            <option value="true">Yes</option>
            <option value="">Not sure</option>
          </select>
        </div>
        <div>
          <label class="flabel" for="a-financing">Financing</label>
          <select class="select" id="a-financing">
            <option value="">Unknown</option>
            <option>Pre-approved</option>
            <option>Talking to a lender</option>
            <option>Paying cash</option>
            <option>Not started yet</option>
          </select>
        </div>
        <div class="span3">
          <label class="flabel" for="a-notes">Notes</label>
          <textarea class="textarea" id="a-notes" placeholder="Where you met them, what they want, anything."></textarea>
        </div>
      </div>
      <div class="add-actions">
        <button class="btn btn-dark" type="submit" id="a-save">Save Lead</button>
        <button class="btn btn-line" type="button" id="a-cancel">Cancel</button>
        <span class="add-err" id="a-err" hidden></span>
      </div>
    </form>

    <div class="stats">
      <div class="stat"><b id="s-total">0</b><span>Total leads</span></div>
      <div class="stat is-hot"><b id="s-hot">0</b><span>Hot right now</span></div>
      <div class="stat"><b id="s-week">0</b><span>Past 7 days</span></div>
    </div>

    <div class="controls">
      <input class="input" id="q" type="search" placeholder="Search name, phone, email, notes">
      <select class="select" id="prop"><option value="">Every property</option></select>
    </div>

    <div class="chips" id="chips">
      <button class="chip" type="button" data-filter="all" aria-pressed="true">All</button>
      <button class="chip" type="button" data-filter="hot" aria-pressed="false">Hot</button>
      <button class="chip" type="button" data-filter="new" aria-pressed="false">New</button>
      <button class="chip" type="button" data-filter="open" aria-pressed="false">Still open</button>
    </div>

    <div class="list" id="list"></div>
    <p class="empty" id="empty" hidden>Nothing here yet.</p>
  </main>

  <div class="saved" id="saved" role="status" aria-live="polite">Saved</div>
</div>

<script>
(function () {
  var SB_URL = 'https://zwsjdcrjwqkzsxollwnc.supabase.co';
  var SB_KEY = 'sb_publishable_FBnSV2WoIc_7MXSAXM0Xww_uEElzvkk';
  var STORE = 'spilo_leads_session';

  /* Same labels and months the sign in sheet writes. Keep the two in sync. */
  var TIMELINES = [
    { label: 'Ready now',      months: 0 },
    { label: '1 to 3 months',  months: 3 },
    { label: '3 to 6 months',  months: 6 },
    { label: '6 to 12 months', months: 12 },
    { label: 'Just looking',   months: 99 }
  ];
  /* Fallback only: rows carry timeline_months, this covers anything
     written before that column existed. Derived so it cannot drift. */
  var MONTHS = {};
  TIMELINES.forEach(function (t) { MONTHS[t.label] = t.months; });
  var STATUSES = ['new', 'contacted', 'following up', 'client', 'dead'];
  var OPEN_STATUSES = ['new', 'contacted', 'following up'];

  var $ = function (id) { return document.getElementById(id); };
  var leads = [];
  var filter = 'all';
  var flashTimer = null;

  function flash() {
    var t = $('saved');
    t.classList.add('on');
    clearTimeout(flashTimer);
    flashTimer = setTimeout(function () { t.classList.remove('on'); }, 1600);
  }

  /* ---------- Session ---------- */

  /* fetch only rejects outright on network failures, and the usual cause
     here is a paused Supabase project: the free tier tears the instance
     down after a few idle weeks and the hostname stops resolving, so the
     browser reports a bare "Failed to fetch". Say what that actually means. */
  function netError(err) {
    var msg = String(err && err.message ? err.message : err);
    if (err instanceof TypeError || /failed to fetch|networkerror|load failed/i.test(msg)) {
      return new Error('Cannot reach the database. The Supabase project is most likely paused. Open supabase.com/dashboard, hit Restore on the project, wait a minute, then try again.');
    }
    return err;
  }

  function saveSession(s) {
    if (!s.expires_at) s.expires_at = Math.floor(Date.now() / 1000) + (s.expires_in || 3600);
    try { localStorage.setItem(STORE, JSON.stringify(s)); } catch (e) {}
  }
  function loadSession() {
    try { return JSON.parse(localStorage.getItem(STORE) || 'null'); } catch (e) { return null; }
  }
  function clearSession() {
    try { localStorage.removeItem(STORE); } catch (e) {}
  }

  function token(grant, body) {
    return fetch(SB_URL + '/auth/v1/token?grant_type=' + grant, {
      method: 'POST',
      headers: { apikey: SB_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok) throw new Error(j.error_description || j.msg || j.error || 'Sign in failed');
        saveSession(j);
        return j;
      });
    }).catch(function (e) { throw netError(e); });
  }

  function refresh() {
    var s = loadSession();
    if (!s || !s.refresh_token) return Promise.resolve(null);
    return token('refresh_token', { refresh_token: s.refresh_token }).catch(function () {
      clearSession();
      return null;
    });
  }

  /* ---------- REST ---------- */

  function api(path, opts, retry) {
    opts = opts || {};
    var s = loadSession();
    if (!s) return Promise.reject(new Error('signed out'));

    var headers = {
      apikey: SB_KEY,
      Authorization: 'Bearer ' + s.access_token,
      'Content-Type': 'application/json'
    };
    if (opts.headers) for (var k in opts.headers) headers[k] = opts.headers[k];

    return fetch(SB_URL + '/rest/v1' + path, {
      method: opts.method || 'GET',
      headers: headers,
      body: opts.body
    }).then(function (r) {
      if (r.status === 401 && retry !== false) {
        return refresh().then(function (ok) {
          if (!ok) throw new Error('signed out');
          return api(path, opts, false);
        });
      }
      if (!r.ok) return r.text().then(function (t) { throw new Error(t || ('HTTP ' + r.status)); });
      if (r.status === 204) return null;
      return r.text().then(function (t) { return t ? JSON.parse(t) : null; });
    }).catch(function (e) { throw netError(e); });
  }

  /* ---------- Helpers ---------- */

  function months(lead) {
    if (lead.timeline_months !== null && lead.timeline_months !== undefined) return lead.timeline_months;
    var m = MONTHS[lead.timeline];
    return m === undefined ? 99 : m;
  }

  /* Hot: nobody else representing them, and they want to move inside 3 months. */
  function isHot(lead) {
    return lead.has_agent === false && months(lead) <= 3;
  }

  function digits(s) { return String(s || '').replace(/\D/g, ''); }

  function prettyPhone(s) {
    var d = digits(s);
    if (d.length === 11 && d.charAt(0) === '1') d = d.slice(1);
    if (d.length !== 10) return s || '';
    return '(' + d.slice(0, 3) + ') ' + d.slice(3, 6) + '-' + d.slice(6);
  }

  function telHref(s) {
    var d = digits(s);
    if (d.length === 10) d = '1' + d;
    return '+' + d;
  }

  function ago(iso) {
    var then = new Date(iso).getTime();
    if (!then) return '';
    var mins = Math.round((Date.now() - then) / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + 'm ago';
    var hrs = Math.round(mins / 60);
    if (hrs < 24) return hrs + 'h ago';
    var days = Math.round(hrs / 24);
    if (days < 30) return days + 'd ago';
    return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  /* Everything a guest typed goes through here, never innerHTML. */
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null && text !== '') n.textContent = text;
    return n;
  }

  function icon(d) {
    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('fill', 'none');
    svg.setAttribute('stroke', 'currentColor');
    svg.setAttribute('stroke-width', '1.9');
    svg.setAttribute('stroke-linecap', 'round');
    svg.setAttribute('stroke-linejoin', 'round');
    svg.setAttribute('aria-hidden', 'true');
    var p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', d);
    svg.appendChild(p);
    return svg;
  }

  var ICON_PHONE = 'M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L8.1 10a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c1 .3 1.9.5 2.9.7a2 2 0 0 1 1.7 2Z';
  var ICON_SMS = 'M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2Z';
  var ICON_MAIL = 'M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Zm18 2-10 7L2 6';

  /* ---------- Render ---------- */

  function matches(lead) {
    if (filter === 'hot' && !isHot(lead)) return false;
    if (filter === 'new' && lead.status !== 'new') return false;
    if (filter === 'open' && OPEN_STATUSES.indexOf(lead.status) === -1) return false;

    var prop = $('prop').value;
    if (prop && (lead.property || '') !== prop) return false;

    var q = $('q').value.trim().toLowerCase();
    if (!q) return true;
    var hay = [lead.name, lead.phone, lead.email, lead.property, lead.notes, lead.agent_notes, lead.timeline]
      .join(' ').toLowerCase();
    if (hay.indexOf(q) !== -1) return true;
    /* Typing a phone number with or without punctuation both work. */
    return digits(q).length >= 3 && digits(lead.phone).indexOf(digits(q)) !== -1;
  }

  function card(lead) {
    var hot = isHot(lead);
    var wrap = el('article', 'lead' + (hot ? ' is-hot' : ''));

    var top = el('div', 'lead-top');
    top.appendChild(el('span', 'lead-name', lead.name || 'No name'));
    if (hot) top.appendChild(el('span', 'badge badge-hot', 'Hot'));
    if (lead.status === 'new') top.appendChild(el('span', 'badge badge-new', 'New'));
    top.appendChild(el('span', 'lead-when', ago(lead.created_at)));
    wrap.appendChild(top);

    if (lead.property) wrap.appendChild(el('p', 'lead-prop', lead.property));

    var meta = el('div', 'lead-meta');
    if (lead.timeline) meta.appendChild(el('span', 'tag' + (months(lead) <= 3 ? ' warn' : ''), lead.timeline));
    meta.appendChild(el('span', 'tag' + (lead.has_agent === false ? ' warn' : ''),
      lead.has_agent === false ? 'No agent' : lead.has_agent === true ? 'Has an agent' : 'Agent unknown'));
    if (lead.financing) meta.appendChild(el('span', 'tag', lead.financing));
    if (lead.source && lead.source !== 'open house') meta.appendChild(el('span', 'tag', lead.source));
    wrap.appendChild(meta);

    if (lead.notes) wrap.appendChild(el('p', 'lead-notes', lead.notes));

    var acts = el('div', 'lead-actions');
    if (lead.phone) {
      var call = el('a', 'primary');
      call.href = 'tel:' + telHref(lead.phone);
      call.appendChild(icon(ICON_PHONE));
      call.appendChild(document.createTextNode('Call ' + prettyPhone(lead.phone)));
      acts.appendChild(call);

      var sms = el('a');
      sms.href = 'sms:' + telHref(lead.phone);
      sms.appendChild(icon(ICON_SMS));
      sms.appendChild(document.createTextNode('Text'));
      acts.appendChild(sms);
    }
    if (lead.email) {
      var mail = el('a');
      mail.href = 'mailto:' + lead.email;
      mail.appendChild(icon(ICON_MAIL));
      mail.appendChild(document.createTextNode('Email'));
      acts.appendChild(mail);
    }
    if (acts.childNodes.length) wrap.appendChild(acts);

    /* Follow up tracking. Both controls save on change or blur. */
    var track = el('div', 'lead-track');

    var sel = el('select', 'select');
    STATUSES.forEach(function (s) {
      var o = el('option', null, s.charAt(0).toUpperCase() + s.slice(1));
      o.value = s;
      if (s === lead.status) o.selected = true;
      sel.appendChild(o);
    });
    track.appendChild(sel);

    var note = el('textarea', 'textarea');
    note.placeholder = 'Follow up notes';
    note.value = lead.agent_notes || '';
    track.appendChild(note);

    function patch(body) {
      return api('/leads?id=eq.' + encodeURIComponent(lead.id), {
        method: 'PATCH',
        headers: { Prefer: 'return=minimal' },
        body: JSON.stringify(body)
      }).then(flash).catch(function (e) { showAppError(e); });
    }

    sel.addEventListener('change', function () {
      lead.status = sel.value;
      patch({ status: sel.value }).then(render);
    });
    note.addEventListener('blur', function () {
      var v = note.value.trim();
      if (v === (lead.agent_notes || '')) return;
      lead.agent_notes = v;
      patch({ agent_notes: v || null });
    });

    wrap.appendChild(track);
    return wrap;
  }

  function render() {
    var shown = leads.filter(matches);
    var list = $('list');
    list.textContent = '';
    shown.forEach(function (l) { list.appendChild(card(l)); });
    $('empty').hidden = shown.length > 0;
    $('empty').textContent = leads.length
      ? 'No leads match that.'
      : 'No leads yet. Put spilo.xyz/signin on a phone at your next open house.';

    var week = Date.now() - 7 * 24 * 3600 * 1000;
    $('s-total').textContent = leads.length;
    $('s-hot').textContent = leads.filter(isHot).length;
    $('s-week').textContent = leads.filter(function (l) { return new Date(l.created_at).getTime() >= week; }).length;
  }

  function fillProperties() {
    var sel = $('prop');
    var current = sel.value;
    var seen = {};
    var props = [];
    leads.forEach(function (l) {
      if (l.property && !seen[l.property]) { seen[l.property] = 1; props.push(l.property); }
    });
    props.sort();
    sel.textContent = '';
    var all = el('option', null, 'Every property');
    all.value = '';
    sel.appendChild(all);
    props.forEach(function (p) {
      var o = el('option', null, p);
      o.value = p;
      if (p === current) o.selected = true;
      sel.appendChild(o);
    });
  }

  function showAppError(e) {
    var msg = String(e && e.message ? e.message : e);
    if (msg.indexOf('signed out') !== -1) { signOut(); return; }
    if (msg.indexOf('relation') !== -1 || msg.indexOf('42P01') !== -1) {
      msg = 'The leads table does not exist yet. Run leads-table.sql in the Supabase SQL editor.';
    }
    $('app-err').textContent = msg;
    $('app-err').hidden = false;
  }

  function load() {
    return api('/leads?select=*&order=created_at.desc').then(function (rows) {
      leads = rows || [];
      $('app-err').hidden = true;
      fillProperties();
      render();
    }).catch(showAppError);
  }

  /* ---------- Export ---------- */

  function csv(v) {
    var s = v === null || v === undefined ? '' : String(v);
    return '"' + s.replace(/"/g, '""') + '"';
  }

  $('export').addEventListener('click', function () {
    var cols = ['created_at', 'name', 'phone', 'email', 'property', 'timeline', 'has_agent', 'financing', 'status', 'notes', 'agent_notes'];
    var rows = [cols.join(',')];
    leads.filter(matches).forEach(function (l) {
      rows.push(cols.map(function (c) { return csv(l[c]); }).join(','));
    });
    var blob = new Blob([rows.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'spilo-leads-' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  });

  /* ---------- Add someone by hand ---------- */

  TIMELINES.forEach(function (t, i) {
    var o = el('option', null, t.label);
    o.value = String(i);
    if (i === 1) o.selected = true;
    $('a-timeline').appendChild(o);
  });

  function resetAdd() {
    ['a-name', 'a-phone', 'a-email', 'a-property', 'a-notes'].forEach(function (id) { $(id).value = ''; });
    $('a-timeline').value = '1';
    $('a-agent').value = 'false';
    $('a-financing').value = '';
    $('a-err').hidden = true;
  }

  $('add-toggle').addEventListener('click', function () {
    var open = $('add').hidden;
    $('add').hidden = !open;
    $('add-toggle').textContent = open ? 'Close' : 'Add Someone';
    if (open) { resetAdd(); $('a-name').focus(); }
  });

  $('a-cancel').addEventListener('click', function () {
    $('add').hidden = true;
    $('add-toggle').textContent = 'Add Someone';
  });

  $('add').addEventListener('submit', function (e) {
    e.preventDefault();
    $('a-err').hidden = true;

    var name = $('a-name').value.trim();
    if (!name) { $('a-err').textContent = 'Name is required.'; $('a-err').hidden = false; $('a-name').focus(); return; }

    var t = TIMELINES[Number($('a-timeline').value)] || TIMELINES[1];
    var agent = $('a-agent').value;
    var row = {
      name: name,
      phone: $('a-phone').value.trim() || null,
      email: $('a-email').value.trim() || null,
      property: $('a-property').value.trim() || null,
      timeline: t.label,
      timeline_months: t.months,
      has_agent: agent === '' ? null : agent === 'true',
      financing: $('a-financing').value || null,
      notes: $('a-notes').value.trim() || null,
      source: 'added by hand'
    };

    var btn = $('a-save');
    btn.disabled = true;
    btn.textContent = 'Saving...';

    api('/leads', {
      method: 'POST',
      headers: { Prefer: 'return=minimal' },
      body: JSON.stringify(row)
    }).then(function () {
      resetAdd();
      $('add').hidden = true;
      $('add-toggle').textContent = 'Add Someone';
      flash();
      return load();
    }).catch(function (err) {
      $('a-err').textContent = String(err && err.message ? err.message : err);
      $('a-err').hidden = false;
    }).then(function () {
      btn.disabled = false;
      btn.textContent = 'Save Lead';
    });
  });

  /* ---------- Wiring ---------- */

  $('q').addEventListener('input', render);
  $('prop').addEventListener('change', render);

  $('chips').addEventListener('click', function (e) {
    var btn = e.target.closest('.chip');
    if (!btn) return;
    filter = btn.getAttribute('data-filter');
    Array.prototype.forEach.call($('chips').children, function (c) {
      c.setAttribute('aria-pressed', String(c === btn));
    });
    render();
  });

  $('login').addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = $('login-btn');
    $('login-err').hidden = true;
    btn.disabled = true;
    btn.textContent = 'Signing in...';
    token('password', { email: $('email').value.trim(), password: $('password').value })
      .then(function () {
        $('password').value = '';
        showApp();
      })
      .catch(function (err) {
        $('login-err').textContent = err.message;
        $('login-err').hidden = false;
      })
      .then(function () {
        btn.disabled = false;
        btn.textContent = 'Sign In';
      });
  });

  function signOut() {
    var s = loadSession();
    clearSession();
    leads = [];
    if (s) {
      fetch(SB_URL + '/auth/v1/logout', {
        method: 'POST',
        headers: { apikey: SB_KEY, Authorization: 'Bearer ' + s.access_token }
      }).catch(function () {});
    }
    $('app').hidden = true;
    $('gate').hidden = false;
  }

  $('signout').addEventListener('click', signOut);

  function showApp() {
    $('gate').hidden = true;
    $('app').hidden = false;
    load();
  }

  /* ---------- Start ---------- */

  var s = loadSession();
  if (!s) {
    $('gate').hidden = false;
  } else if (s.expires_at && s.expires_at - 60 < Math.floor(Date.now() / 1000)) {
    refresh().then(function (ok) { ok ? showApp() : ($('gate').hidden = false); });
  } else {
    showApp();
  }
})();
</script>
</body>
</html>
