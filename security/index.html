<meta name="robots" content="noindex, nofollow">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%231b3a2c'/%3E%3Cpath d='M11 27 20 13 29 27' fill='none' stroke='%23eef7f0' stroke-width='2.4' stroke-linejoin='round' stroke-linecap='round'/%3E%3Cpath d='M20 14v13' stroke='%23e08a52' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  body { background: var(--bg-alt); }
  [hidden] { display: none !important; }

  /* ---------- Sign in ---------- */
  .gate { width: min(100% - 2rem, 420px); margin: 0 auto; padding: clamp(3rem, 12vh, 7rem) 0 4rem; }
  .gate h1 { font-size: clamp(2.2rem, 1.8rem + 2vw, 3rem); margin-top: 0.5rem; }
  .gate form { display: grid; gap: 1rem; margin-top: 1.8rem; }
  .gate .btn { width: 100%; }

  /* ---------- Shell ---------- */
  .bar {
    position: sticky; top: 0; z-index: 50;
    background: oklch(0.975 0.004 90 / 0.94); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .bar-inner {
    width: min(100% - 2rem, 1120px); margin-inline: auto;
    display: flex; align-items: center; gap: 1rem; padding: 0.85rem 0;
  }
  .bar h1 { font-size: 1.5rem; line-height: 1; }
  .bar-actions { margin-left: auto; display: flex; gap: 0.5rem; }
  .bar-actions .btn { padding: 0.55rem 0.95rem; font-size: 0.74rem; }

  .tabs {
    width: min(100% - 2rem, 1120px); margin-inline: auto;
    display: flex; gap: 0.35rem; overflow-x: auto; padding-bottom: 0.6rem;
  }
  .tab {
    padding: 0.55rem 1.05rem; border: 1px solid transparent; border-radius: 100px;
    background: transparent; font-size: 0.86rem; font-weight: 600; cursor: pointer;
    color: var(--muted); white-space: nowrap;
    transition: background-color 0.2s ease, color 0.2s ease;
  }
  .tab:hover { color: var(--ink); background: var(--bg); }
  .tab[aria-selected="true"] { background: var(--charcoal); color: var(--ivory); }
  .tab .count {
    display: inline-block; margin-left: 0.45rem; padding: 0.05rem 0.4rem;
    border-radius: 100px; background: oklch(0.5 0.17 25); color: #fff;
    font-size: 0.7rem; font-weight: 700;
  }

  .page { width: min(100% - 2rem, 1120px); margin: 0 auto; padding: 1.5rem 0 5rem; }

  .err {
    font-size: 0.9rem; line-height: 1.55; color: oklch(0.42 0.16 25);
    background: oklch(0.97 0.02 25); border: 1px solid oklch(0.82 0.09 25);
    border-radius: var(--r-sm); padding: 0.85rem 1rem; margin-bottom: 1.2rem;
  }

  /* ---------- Stats ---------- */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.8rem; margin-bottom: 1.5rem; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-md); padding: 1rem 1.1rem; }
  .stat b { display: block; font-family: var(--font-display); font-size: 2.1rem; line-height: 1; font-weight: 400; }
  .stat span { display: block; margin-top: 0.35rem; font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .stat.is-hot b { color: oklch(0.5 0.17 25); }

  /* ---------- Controls ---------- */
  .controls { display: grid; grid-template-columns: 1fr 260px; gap: 0.8rem; margin-bottom: 1rem; }
  .chips { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.5rem; }
  .chip {
    padding: 0.55rem 1rem; border: 1px solid var(--line-strong); border-radius: 100px;
    background: var(--bg); font-size: 0.84rem; font-weight: 550; cursor: pointer;
    transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
  }
  .chip:hover { border-color: var(--ink); }
  .chip[aria-pressed="true"] { background: var(--charcoal); border-color: var(--charcoal); color: var(--ivory); }

  /* ---------- Add someone ---------- */
  .add {
    background: var(--card); border: 1px solid var(--gold-line); border-radius: var(--r-md);
    padding: 1.3rem; margin-bottom: 1.5rem; box-shadow: var(--shadow-sm);
  }
  .add h2 { font-size: 1.5rem; margin-bottom: 1.1rem; }
  .add-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.9rem; }
  .add-grid .span2 { grid-column: span 2; }
  .add-grid .span3 { grid-column: 1 / -1; }
  .add-grid .input, .add-grid .select, .add-grid .textarea { margin-top: 0.35rem; }
  .add-grid .textarea { min-height: 70px; }
  .add-actions { display: flex; gap: 0.7rem; margin-top: 1.2rem; align-items: center; }
  .add-err { font-size: 0.86rem; color: oklch(0.45 0.17 25); }

  /* ---------- Lead cards ---------- */
  .list { display: grid; gap: 0.6rem; }
  .lead {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r-md);
    padding: 0.75rem 0.9rem; box-shadow: var(--shadow-sm);
  }
  .lead.is-hot { border-color: oklch(0.82 0.09 25); box-shadow: 0 0 0 1px oklch(0.82 0.09 25 / 0.4), var(--shadow-sm); }
  .lead-top { display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap; }
  .lead-name { font-size: 1.02rem; font-weight: 650; letter-spacing: -0.01em; }
  .lead-when { margin-left: auto; font-size: 0.78rem; color: var(--faint); white-space: nowrap; }
  .badge {
    font-size: 0.68rem; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase;
    padding: 0.18rem 0.42rem; border-radius: var(--r-sm); border: 1px solid;
  }
  .badge-hot { color: oklch(0.45 0.17 25); background: oklch(0.965 0.028 25); border-color: oklch(0.85 0.09 25); }
  .badge-new { color: var(--gold-deep); background: var(--gold-soft); border-color: var(--gold-line); }
  .lead-prop { margin-top: 0.15rem; font-size: 0.85rem; color: var(--muted); }
  .lead-meta { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.45rem; align-items: center; }
  .tag {
    font-size: 0.74rem; color: var(--muted); background: var(--bg-alt);
    border: 1px solid var(--line); border-radius: var(--r-sm); padding: 0.16rem 0.42rem;
  }
  .tag.warn { color: oklch(0.45 0.17 25); background: oklch(0.965 0.028 25); border-color: oklch(0.85 0.09 25); }
  .lead-notes {
    margin-top: 0.55rem; font-size: 0.85rem; line-height: 1.5; color: var(--ink);
    border-left: 2px solid var(--gold-line); padding-left: 0.9rem;
  }
  .lead-actions { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.6rem; }
  .lead-actions a {
    display: inline-flex; align-items: center; gap: 0.34rem;
    padding: 0.42rem 0.72rem; border: 1px solid var(--line-strong); border-radius: var(--r-sm);
    font-size: 0.8rem; font-weight: 600; transition: background-color 0.2s ease, border-color 0.2s ease;
  }
  .lead-actions a:hover { background: var(--bg-alt); border-color: var(--ink); }
  .lead-actions a.primary { background: var(--charcoal); border-color: var(--charcoal); color: var(--ivory); }
  .lead-actions a.primary:hover { background: var(--charcoal-deep); }
  .lead-actions svg { width: 13px; height: 13px; opacity: 0.75; }
  .lead-track {
    display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem;
    margin-top: 0.7rem; padding-top: 0.7rem; border-top: 1px solid var(--line);
  }
  /* A dead lead stays readable but stops competing for attention. */
  .lead.is-dead { opacity: 0.5; }
  .lead.is-dead:hover, .lead.is-dead:focus-within { opacity: 1; }
  .lead-del {
    margin-left: auto; padding: 0.42rem 0.75rem; font-size: 0.78rem; font-weight: 600;
    color: var(--faint); background: none; border: 1px solid var(--line);
    border-radius: var(--r-sm); cursor: pointer;
    transition: color 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;
  }
  .lead-del:hover {
    color: oklch(0.45 0.17 25); border-color: oklch(0.85 0.09 25); background: oklch(0.965 0.028 25);
  }
  .lead-track .select { width: auto; min-width: 150px; padding: 0.42rem 0.7rem; font-size: 0.85rem; }
  .lead-track .textarea { min-height: 38px; font-size: 0.85rem; padding: 0.5rem 0.7rem; flex: 1 1 240px; }

  .saved {
    position: fixed; left: 50%; bottom: 1.6rem; transform: translate(-50%, 12px);
    z-index: 80; padding: 0.7rem 1.3rem; border-radius: 100px;
    background: var(--charcoal); color: var(--ivory);
    font-size: 0.82rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
    box-shadow: var(--shadow-md); opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s var(--ease-out);
  }
  .saved.on { opacity: 1; transform: translate(-50%, 0); }

  .empty { text-align: center; padding: 4rem 1rem; color: var(--muted); }

  /* ---------- QR panel ---------- */
  .qr-setup { margin-bottom: 2rem; }
  .qr-setup h2 { font-size: 1.9rem; }
  .qr-row { display: grid; grid-template-columns: 1fr auto auto; gap: 0.7rem; margin-top: 1.3rem; align-items: end; }
  .qr-links { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; align-items: center; }
  .qr-url {
    font-size: 0.82rem; color: var(--muted); word-break: break-all;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r-sm);
    padding: 0.5rem 0.7rem; flex: 1 1 320px;
  }
  .qr-links .btn { padding: 0.55rem 1rem; font-size: 0.76rem; }

  .sign {
    background: #fff; border: 1px solid var(--line); border-radius: var(--r-md);
    box-shadow: var(--shadow-md); padding: clamp(2rem, 6vw, 3.5rem) clamp(1.5rem, 5vw, 3rem);
    text-align: center; max-width: 720px; margin: 0 auto;
  }
  .sign-kicker { font-size: 0.78rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold-deep); font-weight: 650; }
  .sign h3 { font-family: var(--font-display); font-weight: 400; font-size: clamp(2.4rem, 1.8rem + 3.2vw, 4rem); margin-top: 0.7rem; line-height: 1.02; }
  .sign-addr { margin-top: 1rem; font-size: 0.95rem; font-weight: 650; color: var(--gold-deep); }
  .qr-holder { margin: clamp(1.6rem, 4vw, 2.4rem) auto 0; width: fit-content; }
  .qr-holder svg { display: block; width: clamp(200px, 40vw, 300px); height: auto; }
  .sign-help { margin-top: 1.3rem; font-size: 1rem; color: var(--muted); }
  .sign-foot {
    margin-top: clamp(1.6rem, 4vw, 2.2rem); padding-top: 1.2rem; border-top: 1px solid var(--line);
    font-size: 0.84rem; color: var(--muted); line-height: 1.6;
  }
  .sign-foot strong { color: var(--ink); }
  .sign-err { color: oklch(0.45 0.17 25); font-size: 0.95rem; margin-top: 1.5rem; }

  /* ---------- Cards used by Listings and Status ---------- */
  .panel-card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r-md);
    padding: 1.5rem; margin-bottom: 1rem; box-shadow: var(--shadow-sm);
  }
  .panel-card h2 { font-size: 1.5rem; margin-bottom: 0.6rem; }
  .panel-card p { color: var(--muted); font-size: 0.94rem; line-height: 1.65; }
  .panel-card .btn { margin-top: 1.2rem; }
  .links-row { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1.2rem; }
  .links-row .btn { padding: 0.6rem 1.1rem; font-size: 0.78rem; }

  .check { display: flex; gap: 0.9rem; align-items: flex-start; padding: 0.95rem 0; border-bottom: 1px solid var(--line); }
  .check:last-child { border-bottom: none; }
  .check-dot { width: 11px; height: 11px; border-radius: 50%; flex: none; margin-top: 0.45rem; background: var(--faint); }
  .check-dot.ok { background: oklch(0.62 0.15 150); }
  .check-dot.bad { background: oklch(0.55 0.19 25); }
  .check-dot.warn { background: var(--gold); }
  .check-body { min-width: 0; }
  .check-body b { display: block; font-size: 0.96rem; font-weight: 650; }
  .check-body p { font-size: 0.87rem; color: var(--muted); margin-top: 0.2rem; line-height: 1.6; }
  .check-body code { font-size: 0.82rem; background: var(--bg-alt); padding: 0.1rem 0.35rem; border-radius: 3px; }

  @media (max-width: 780px) {
    .controls { grid-template-columns: 1fr; }
    .stats { grid-template-columns: 1fr; }
    .stat { display: flex; align-items: baseline; gap: 0.8rem; }
    .stat b { font-size: 1.7rem; }
    .stat span { margin-top: 0; }
    .add-grid { grid-template-columns: 1fr; }
    .add-grid .span2, .add-grid .span3 { grid-column: auto; }
    .qr-row { grid-template-columns: 1fr; }
    .lead-actions { gap: 0.35rem; }
    .lead-actions a.primary { flex: 1 1 100%; justify-content: center; }
    .lead-actions a, .lead-actions button.act { flex: 1 1 auto; justify-content: center; }
    .bar h1 { font-size: 1.25rem; }
  }

  /* ---------- Today ---------- */
  .week {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r-md);
    padding: 1.2rem 1.3rem; margin-bottom: 1.4rem; box-shadow: var(--shadow-sm);
  }
  .week-top { display: flex; align-items: baseline; gap: 0.7rem; flex-wrap: wrap; }
  .week-num { font-family: var(--font-display); font-size: 2.4rem; line-height: 1; font-weight: 400; }
  .week-of { font-size: 0.95rem; color: var(--muted); }
  .week-label { margin-left: auto; font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .week-bar { height: 8px; border-radius: 100px; background: var(--bg-alt); border: 1px solid var(--line); margin-top: 0.9rem; overflow: hidden; }
  .week-fill { height: 100%; background: var(--charcoal); border-radius: 100px; transition: width 0.4s var(--ease-out); }
  .week-fill.is-there { background: oklch(0.62 0.15 150); }
  .week-note { margin-top: 0.6rem; font-size: 0.82rem; color: var(--muted); line-height: 1.55; }

  .due { border-left: 3px solid var(--line-strong); }
  .due.is-over { border-left-color: oklch(0.55 0.19 25); }
  .due.is-today { border-left-color: var(--gold); }
  .due-when {
    font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 0.18rem 0.45rem; border-radius: var(--r-sm); border: 1px solid;
    color: var(--muted); background: var(--bg-alt); border-color: var(--line);
  }
  .due-when.is-over { color: oklch(0.45 0.17 25); background: oklch(0.965 0.028 25); border-color: oklch(0.85 0.09 25); }
  .due-when.is-today { color: var(--gold-deep); background: var(--gold-soft); border-color: var(--gold-line); }
  /* The step sits on the same line as how late it is, so the two things you
     actually read are one glance instead of two. It still wraps to its own
     line on a narrow phone rather than squeezing. */
  .due-action-inline {
    flex: 1 1 14rem; min-width: 0;
    font-size: 0.86rem; line-height: 1.4; font-weight: 650; color: var(--ink);
  }

  /* ---------- Segment and read ---------- */
  .seg {
    font-size: 0.68rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 0.18rem 0.45rem; border-radius: var(--r-sm);
    border: 1px solid var(--line-strong); background: var(--bg); color: var(--ink);
  }
  .seg-A { color: oklch(0.45 0.17 25);  background: oklch(0.965 0.028 25); border-color: oklch(0.85 0.09 25); }
  .seg-B { color: var(--gold-deep);     background: var(--gold-soft);      border-color: var(--gold-line); }
  .seg-C { color: oklch(0.4 0.11 250);  background: oklch(0.96 0.02 250);  border-color: oklch(0.83 0.07 250); }
  .seg-D { color: var(--faint);         background: var(--bg-alt);         border-color: var(--line); }
  .seg-E { color: oklch(0.42 0.09 150); background: oklch(0.96 0.03 150);  border-color: oklch(0.83 0.07 150); }

  /* My read outranks whatever they wrote on the clipboard, so it gets the
     loud treatment and the captured timeline gets the quiet one. */
  .read {
    font-size: 0.74rem; font-weight: 750; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 0.24rem 0.6rem; border-radius: 100px; border: 1.5px solid;
  }
  .read-hot  { color: #fff; background: oklch(0.55 0.19 25); border-color: oklch(0.5 0.19 25); }
  .read-warm { color: var(--charcoal); background: var(--gold); border-color: var(--gold-deep); }
  .read-cold { color: var(--muted); background: var(--bg-alt); border-color: var(--line-strong); }
  .read-set {
    font-size: 0.74rem; font-weight: 600; padding: 0.24rem 0.6rem; border-radius: 100px;
    border: 1.5px dashed var(--line-strong); background: none; color: var(--faint);
    cursor: pointer; font-family: inherit;
  }
  .read-set:hover { border-color: var(--ink); color: var(--ink); }
  .read-note { margin-top: 0.45rem; font-size: 0.86rem; line-height: 1.5; color: var(--ink); font-style: italic; }

  .badge-bad { color: oklch(0.45 0.17 25); background: oklch(0.965 0.028 25); border-color: oklch(0.85 0.09 25); }
  .badge-dnc { color: #fff; background: oklch(0.42 0.02 260); border-color: oklch(0.42 0.02 260); }

  /* ---------- Blocked outbound ---------- */
  .blocked {
    margin-top: 0.7rem; font-size: 0.84rem; line-height: 1.55;
    color: oklch(0.42 0.03 260); background: var(--bg-alt);
    border: 1px dashed var(--line-strong); border-radius: var(--r-sm); padding: 0.65rem 0.85rem;
  }
  .blocked b { font-weight: 700; color: var(--ink); }
  .lead-actions button.act {
    display: inline-flex; align-items: center; gap: 0.34rem; cursor: pointer;
    padding: 0.42rem 0.72rem; border: 1px solid var(--line-strong); border-radius: var(--r-sm);
    background: var(--bg); color: var(--ink);
    font-size: 0.8rem; font-weight: 600; font-family: inherit;
    transition: background-color 0.2s ease, border-color 0.2s ease;
  }
  .lead-actions button.act:hover { background: var(--bg-alt); border-color: var(--ink); }
  .lead-actions button.act.primary { background: var(--charcoal); border-color: var(--charcoal); color: var(--ivory); }
  .lead-actions button.act.primary:hover { background: var(--charcoal-deep); }
  .lead-actions button.act svg { width: 13px; height: 13px; opacity: 0.75; }

  /* ---------- Touch history ---------- */
  .hist { margin-top: 0.7rem; padding-top: 0.7rem; border-top: 1px solid var(--line); }
  .hist-head {
    display: flex; align-items: center; gap: 0.5rem; width: 100%;
    background: none; border: none; padding: 0; cursor: pointer; font-family: inherit;
    font-size: 0.78rem; font-weight: 650; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted);
  }
  .hist-head:hover { color: var(--ink); }
  .hist-head .caret { width: 12px; height: 12px; flex: none; transition: transform 0.2s ease; }
  .hist-head[aria-expanded="true"] .caret { transform: rotate(90deg); }
  .hist-rows { margin-top: 0.6rem; display: grid; gap: 0.4rem; }
  .hist-row { display: flex; gap: 0.6rem; align-items: baseline; font-size: 0.84rem; line-height: 1.5; }
  .hist-when { color: var(--faint); font-size: 0.78rem; white-space: nowrap; flex: none; width: 5.4rem; }
  .hist-what { min-width: 0; }
  .hist-out { font-weight: 650; }
  .hist-out.good { color: oklch(0.45 0.14 150); }
  .hist-out.meh  { color: var(--muted); }
  .hist-out.bad  { color: oklch(0.5 0.17 25); }
  .hist-note { color: var(--muted); }

  /* ---------- Modal ---------- */
  .scrim {
    position: fixed; inset: 0; z-index: 90; background: oklch(0.2 0.01 260 / 0.55);
    display: flex; align-items: flex-end; justify-content: center; padding: 0;
    overscroll-behavior: contain;
  }
  .sheet-modal {
    background: var(--card); width: 100%; max-width: 560px;
    border-radius: var(--r-md) var(--r-md) 0 0;
    max-height: 92vh; overflow-y: auto;
    padding: 1.3rem 1.2rem calc(1.4rem + env(safe-area-inset-bottom));
    box-shadow: var(--shadow-md);
  }
  .sheet-modal h2 { font-size: 1.4rem; }
  .sheet-modal .who { margin-top: 0.2rem; font-size: 0.88rem; color: var(--muted); }
  .modal-block { margin-top: 1.2rem; }
  .modal-block > .flabel { display: block; margin-bottom: 0.5rem; }
  .opts { display: flex; flex-wrap: wrap; gap: 0.45rem; }
  .opt {
    flex: 1 1 auto; min-width: 0; padding: 0.75rem 0.7rem; cursor: pointer;
    border: 1px solid var(--line-strong); border-radius: var(--r-sm);
    background: var(--bg); color: var(--ink); font-family: inherit;
    font-size: 0.86rem; font-weight: 600; text-align: center; white-space: nowrap;
    transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .opt:hover { border-color: var(--ink); }
  .opt[aria-pressed="true"] { background: var(--charcoal); border-color: var(--charcoal); color: var(--ivory); }
  .opt.wide { flex: 1 1 45%; }
  .modal-actions { display: flex; gap: 0.7rem; margin-top: 1.5rem; align-items: center; }
  .modal-actions .btn { flex: 1 1 auto; }
  .modal-actions .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .modal-err { margin-top: 0.8rem; font-size: 0.86rem; color: oklch(0.45 0.17 25); }
  .forced {
    margin-top: 0.6rem; font-size: 0.8rem; line-height: 1.5; color: var(--gold-deep);
    background: var(--gold-soft); border: 1px solid var(--gold-line);
    border-radius: var(--r-sm); padding: 0.6rem 0.8rem;
  }
  .modal-date { display: flex; gap: 0.6rem; align-items: center; margin-top: 0.6rem; }
  .modal-date .input { flex: 1 1 auto; }

  /* ---------- Their schedule ---------- */
  .sched { display: grid; gap: 0.25rem; max-height: 260px; overflow-y: auto; }
  .sched-row {
    display: flex; gap: 0.6rem; align-items: baseline;
    font-size: 0.82rem; line-height: 1.45; padding: 0.32rem 0.45rem;
    border: 1px solid transparent; border-radius: var(--r-sm);
  }
  .sched-row.is-done { opacity: 0.4; }
  .sched-row.is-done .sched-what { text-decoration: line-through; }
  .sched-row.is-now {
    background: var(--gold-soft); border-color: var(--gold-line); font-weight: 650;
  }
  .sched-when { flex: none; width: 5.8rem; color: var(--muted); font-size: 0.78rem; }
  .sched-row.is-now .sched-when { color: var(--gold-deep); }
  .sched-what { min-width: 0; }
  .sched-tick { flex: none; width: 1rem; color: oklch(0.55 0.13 150); font-weight: 700; }

  /* ---------- Farm ---------- */
  .farm-bar { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; margin-bottom: 1.2rem; }
  .farm-bar .btn { padding: 0.6rem 1.1rem; font-size: 0.78rem; }
  .street { margin-bottom: 1.6rem; }
  .street-head {
    display: flex; align-items: baseline; gap: 0.7rem; flex-wrap: wrap;
    padding-bottom: 0.5rem; border-bottom: 2px solid var(--line-strong); margin-bottom: 0.6rem;
  }
  .street-head h3 { font-size: 1.15rem; font-weight: 650; }
  .street-head span { font-size: 0.8rem; color: var(--muted); margin-left: auto; }
  .parcel {
    display: flex; gap: 0.8rem; align-items: flex-start;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r-sm);
    padding: 0.7rem 0.85rem; margin-bottom: 0.4rem;
  }
  .parcel.is-knocked { opacity: 0.55; }
  .parcel-knock {
    flex: none; width: 26px; height: 26px; margin-top: 0.1rem; cursor: pointer;
    border: 1.5px solid var(--line-strong); border-radius: var(--r-sm);
    background: var(--bg); display: grid; place-items: center; padding: 0;
    color: transparent; transition: background-color 0.15s ease, border-color 0.15s ease;
  }
  .parcel-knock[aria-pressed="true"] { background: oklch(0.62 0.15 150); border-color: oklch(0.55 0.15 150); color: #fff; }
  .parcel-knock svg { width: 15px; height: 15px; }
  .parcel-body { min-width: 0; flex: 1 1 auto; }
  .parcel-addr { font-size: 0.95rem; font-weight: 650; }
  .parcel-meta { margin-top: 0.25rem; font-size: 0.8rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .parcel-side { flex: none; display: flex; flex-direction: column; gap: 0.35rem; align-items: flex-end; }
  .parcel-side .mini {
    padding: 0.34rem 0.65rem; font-size: 0.74rem; font-weight: 600; cursor: pointer;
    border: 1px solid var(--line-strong); border-radius: var(--r-sm);
    background: var(--bg); color: var(--ink); font-family: inherit; white-space: nowrap;
  }
  .parcel-side .mini:hover { border-color: var(--ink); background: var(--bg-alt); }
  .tag-abs { color: oklch(0.4 0.11 250); background: oklch(0.96 0.02 250); border: 1px solid oklch(0.83 0.07 250); border-radius: var(--r-sm); padding: 0.1rem 0.4rem; }

  /* ---------- Templates ---------- */
  .tpl { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-md); padding: 1rem 1.1rem; margin-bottom: 0.7rem; }
  .tpl-top { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
  .tpl-top .input { flex: 1 1 200px; }
  .tpl-top .select { width: auto; min-width: 110px; }
  .tpl .textarea { margin-top: 0.6rem; min-height: 96px; font-size: 0.88rem; }
  .tpl-foot { display: flex; gap: 0.5rem; align-items: center; margin-top: 0.6rem; flex-wrap: wrap; }
  .tpl-foot .mini {
    padding: 0.42rem 0.8rem; font-size: 0.76rem; font-weight: 600; cursor: pointer;
    border: 1px solid var(--line-strong); border-radius: var(--r-sm);
    background: var(--bg); color: var(--ink); font-family: inherit;
  }
  .tpl-foot .mini:hover { border-color: var(--ink); background: var(--bg-alt); }
  .tpl-foot .mini.danger:hover { color: oklch(0.45 0.17 25); border-color: oklch(0.85 0.09 25); background: oklch(0.965 0.028 25); }
  .tpl-hint { font-size: 0.78rem; color: var(--faint); margin-left: auto; }
  .json-edit { width: 100%; min-height: 220px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.8rem; line-height: 1.5; }

  @media (max-width: 780px) {
    .hist-when { width: 4.6rem; }
    .parcel-side { flex-direction: row; }
    .week-label { margin-left: 0; width: 100%; }
  }

  /* ---------- Farm walk sheet, landscape on a clipboard ---------- */
  .walk { display: none; }
  @media print {
    body.printing-walk .bar,
    body.printing-walk .page > section:not(#panel-farm) { display: none !important; }
    body.printing-walk #panel-farm > *:not(.walk) { display: none !important; }
    body.printing-walk .walk { display: block; }
    body.printing-walk .walk h2 { font-size: 16pt; margin-bottom: 0.12in; }
    body.printing-walk .walk h3 { font-size: 12pt; margin: 0.18in 0 0.06in; border-bottom: 1.5pt solid #000; padding-bottom: 0.04in; }
    body.printing-walk .walk table { width: 100%; border-collapse: collapse; font-size: 9.5pt; }
    body.printing-walk .walk th { text-align: left; font-size: 8pt; text-transform: uppercase; letter-spacing: 0.06em; padding: 0.04in 0.05in; border-bottom: 0.5pt solid #666; }
    body.printing-walk .walk td { padding: 0.075in 0.05in; border-bottom: 0.5pt solid #ccc; vertical-align: top; }
    body.printing-walk .walk .box { display: inline-block; width: 0.16in; height: 0.16in; border: 1pt solid #000; }
    body.printing-walk .walk .note-line { display: block; min-width: 1.6in; border-bottom: 0.5pt solid #999; height: 0.16in; }
  }

  /* ---------- Print: only the sign, portrait US Letter ----------
     margin 0 on the page box is what stops the browser printing its own
     header and footer (date, title, URL) into the margin area. The half
     inch of breathing room is put back as padding on the sign itself. */
  @page { size: Letter portrait; margin: 0; }

  @media print {
    html, body { margin: 0; padding: 0; background: #fff; }
    body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .bar, .tabs, .qr-setup, .saved, .no-print { display: none !important; }
    .page { width: 8.5in; max-width: 8.5in; margin: 0; padding: 0; }
    #panel-qr { display: block !important; }
    .sign {
      width: 8.5in; max-width: 8.5in; height: 10.9in;
      margin: 0; padding: 0.5in; border: none; box-shadow: none; border-radius: 0;
      display: flex; flex-direction: column; justify-content: center;
    }
    .sign-addr { display: none; }
    .sign-kicker { font-size: 11pt; }
    .sign h3 { font-size: 52pt; margin-top: 0.12in; }
    .qr-holder { margin: 0.5in auto 0; }
    .qr-holder svg { width: 3.4in; height: 3.4in; }
    .sign-help { font-size: 14pt; margin-top: 0.3in; }
    .sign-foot { margin-top: 0.5in; padding-top: 0.2in; font-size: 10.5pt; }
  }
</style>
</head>
<body>

<div id="app">
  <header class="bar">
    <div class="bar-inner">
      <h1>Security</h1>
      <div class="bar-actions">
        <a class="btn btn-line" href="/dashboard/">Dashboard</a>
        <a class="btn btn-line" href="https://spilotrosrealty.com/" target="_blank" rel="noopener">View Site</a>
      </div>
    </div>
  </header>

  <main class="page">
    <section id="panel-status">
      <div class="panel-card" id="signed-out" hidden>
        <h2>Sign in first</h2>
        <p>These checks run as you, so they need your dashboard sign in.</p>
        <a class="btn btn-dark" href="/dashboard/">Sign In on the Dashboard</a>
      </div>
      <div class="panel-card" id="checks-card" hidden>
        <h2>Security</h2>
        <p>Checked live against your database every time you open this page.</p>
        <div id="checks" style="margin-top:1.2rem"></div>
        <button class="btn btn-line" type="button" id="recheck" style="margin-top:1.4rem">Check Again</button>
      </div>
    </section>
  </main>
</div>
<script>
(function () {
  var SB_URL = 'https://zwsjdcrjwqkzsxollwnc.supabase.co';
  var SB_KEY = 'sb_publishable_FBnSV2WoIc_7MXSAXM0Xww_uEElzvkk';
  var STORE = 'spilo_leads_session';

  var $ = function (id) { return document.getElementById(id); };

  function netError(err) {
    var msg = String(err && err.message ? err.message : err);
    if (err instanceof TypeError || /failed to fetch|networkerror|load failed/i.test(msg)) {
      return new Error('Cannot reach the database. The Supabase project is most likely paused. Open supabase.com/dashboard, hit Restore on the project, wait a minute, then try again.');
    }
    return err;
  }

  function saveSession(s) {
    if (!s.expires_at) s.expires_at = Math.floor(Date.now() / 1000) + (s.expires_in || 3600);
    try { localStorage.setItem(STORE, JSON.stringify(s)); } catch (e) {}
  }

  function loadSession() {
    try { return JSON.parse(localStorage.getItem(STORE) || 'null'); } catch (e) { return null; }
  }

  function clearSession() { try { localStorage.removeItem(STORE); } catch (e) {} }

  function token(grant, body) {
    return fetch(SB_URL + '/auth/v1/token?grant_type=' + grant, {
      method: 'POST',
      headers: { apikey: SB_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok) throw new Error(j.error_description || j.msg || j.error || 'Sign in failed');
        saveSession(j);
        return j;
      });
    }).catch(function (e) { throw netError(e); });
  }

  function refresh() {
    var s = loadSession();
    if (!s || !s.refresh_token) return Promise.resolve(null);
    return token('refresh_token', { refresh_token: s.refresh_token })
      .catch(function () { clearSession(); return null; });
  }

  function api(path, opts, retry) {
    opts = opts || {};
    var s = loadSession();
    if (!s) return Promise.reject(new Error('signed out'));
    var headers = { apikey: SB_KEY, Authorization: 'Bearer ' + s.access_token, 'Content-Type': 'application/json' };
    if (opts.headers) for (var k in opts.headers) headers[k] = opts.headers[k];

    return fetch(SB_URL + '/rest/v1' + path, { method: opts.method || 'GET', headers: headers, body: opts.body })
      .then(function (r) {
        if (r.status === 401 && retry !== false) {
          return refresh().then(function (ok) {
            if (!ok) throw new Error('signed out');
            return api(path, opts, false);
          });
        }
        if (!r.ok) return r.text().then(function (t) { throw new Error(t || ('HTTP ' + r.status)); });
        if (r.status === 204) return null;
        return r.text().then(function (t) { return t ? JSON.parse(t) : null; });
      })
      .catch(function (e) { throw netError(e); });
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null && text !== '') n.textContent = text;
    return n;
  }

  function checkRow(state, title, detail) {
    var row = el('div', 'check');
    row.appendChild(el('span', 'check-dot ' + state));
    var body = el('div', 'check-body');
    body.appendChild(el('b', null, title));
    var p = el('p');
    p.innerHTML = detail;   /* fixed strings written here, no user data */
    body.appendChild(p);
    row.appendChild(body);
    return row;
  }

  function runChecks() {
    var box = $('checks');
    box.textContent = '';
    box.appendChild(checkRow('', 'Checking...', 'Asking the database how things stand.'));

    var results = [];
    var problems = 0;

    /* Can a stranger register an account? That is the one that matters,
       because every policy below trusts who you are. */
    var signupCheck = fetch(SB_URL + '/auth/v1/settings', { headers: { apikey: SB_KEY } })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j.disable_signup === true) {
          results.push(['ok', 'Public signup is off', 'Nobody can create an account on your project. This is the setting that keeps everything else honest.']);
        } else {
          problems++;
          results.push(['bad', 'Public signup is ON', 'Anyone can register an account on your project. Turn it off: Supabase dashboard, Authentication, Sign In / Providers, Email, uncheck <b>Allow new users to sign up</b>.']);
        }
      })
      .catch(function () {
        results.push(['warn', 'Could not check signup', 'The auth service did not answer. If the project is paused, restore it first.']);
      });

    /* Does the leads table exist, and can we read it as ourselves? */
    var leadsCheck = api('/leads?select=id&limit=1')
      .then(function () {
        results.push(['ok', 'Leads table is live', 'It exists and you can read it.']);
      })
      .catch(function (e) {
        problems++;
        var msg = String(e && e.message ? e.message : e);
        if (msg.indexOf('PGRST205') !== -1 || msg.indexOf('schema cache') !== -1) {
          results.push(['bad', 'Leads table does not exist', 'Run <code>leads-table.sql</code> in the SQL editor. Until then every sign in is stranded on the phone that captured it.']);
        } else {
          results.push(['bad', 'Cannot read the leads table', msg]);
        }
      });

    /* Anonymous read attempt. This is the actual test that matters:
       it uses the public key with no login, exactly like a stranger would. */
    var anonCheck = fetch(SB_URL + '/rest/v1/leads?select=id&limit=1', {
      headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY }
    }).then(function (r) {
      if (r.status === 200) {
        problems++;
        results.push(['bad', 'Your leads are readable by the public', 'A signed out request just read the table. Run <code>leads-table.sql</code>, it is the file that turns row level security on.']);
      } else if (r.status === 404) {
        results.push(['warn', 'Public read blocked, table missing', 'Nothing is exposed, but only because the table is not there yet.']);
      } else {
        results.push(['ok', 'Leads are private', 'A signed out request was refused. Only you can read them.']);
      }
    }).catch(function () {
      results.push(['warn', 'Could not test public access', 'The database did not answer.']);
    });

    Promise.all([signupCheck, leadsCheck, anonCheck]).then(function () {
      box.textContent = '';
      var order = { bad: 0, warn: 1, ok: 2 };
      results.sort(function (a, b) { return order[a[0]] - order[b[0]]; });
      results.forEach(function (r) { box.appendChild(checkRow(r[0], r[1], r[2])); });
    });
  }

  $('recheck').addEventListener('click', runChecks);

  var s = loadSession();
  if (!s) {
    $('signed-out').hidden = false;
  } else {
    $('checks-card').hidden = false;
    runChecks();
  }
})();
</script>
</body>
</html>
